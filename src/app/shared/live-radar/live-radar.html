<section
  class="p-5 rounded-2xl bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white shadow-xl relative overflow-hidden border border-slate-800/80 mb-6"
>
  <!-- Subtle background glow -->
  <div
    class="absolute -right-16 -top-16 w-56 h-56 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"
  ></div>

  <div class="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-6">
    <!-- Left: Live Telemetry Indicator -->
    <div class="flex items-center gap-4">
      <div class="relative flex items-center justify-center">
        <div
          class="w-13 h-13 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 shadow-inner"
        >
          <span class="material-symbols-outlined icon-size-7">sensors</span>
        </div>
        <span class="absolute -top-1 -right-1 flex h-3.5 w-3.5">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"
          ></span>
          <span
            class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500 border-2 border-slate-900"
          ></span>
        </span>
      </div>

      <div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-400"
            >Canlı Radar</span
          >
          <span class="text-[11px] px-2 py-0.5 rounded-md bg-white/10 text-slate-300 font-medium"
            >Kabin Kapasitesi: {{ maxCapacity() }}</span
          >
        </div>
        <div class="flex items-baseline gap-2 mt-1">
          <span class="text-3xl font-black text-white tracking-tight leading-none">{{
            currentCount()
          }}</span>
          <span class="text-xs sm:text-sm font-semibold text-slate-300">Aktif Seans</span>
          <span
            class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"
          >
            %{{ occupancyPercentage() }} Doluluk
          </span>
        </div>
      </div>
    </div>

    <!-- Middle: Dynamic Progress Bar -->
    <div class="w-full lg:max-w-xs space-y-1.5">
      <div class="flex justify-between text-xs text-slate-400 font-medium">
        <span>Sakin Seviye</span>
        <span class="text-white font-bold">%{{ occupancyPercentage() }}</span>
        <span>Pik Seviye</span>
      </div>
      <div
        class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-700/60"
      >
        <div
          class="h-full rounded-full bg-gradient-to-r from-emerald-500 via-teal-400 to-indigo-500 transition-all duration-500"
          [style.width.%]="occupancyPercentage()"
        ></div>
      </div>
    </div>

    <!-- Right: Real-time Metrics & Status -->
    <div
      class="flex items-center gap-6 pt-4 lg:pt-0 border-t lg:border-t-0 border-slate-800/80 text-xs"
    >
      <div>
        <span class="text-slate-400 block text-[11px] font-medium">Bugün Toplam Randevu</span>
        <span class="text-xl font-black text-white tracking-tight">{{ todayTotal() }}</span>
      </div>
      <div class="h-8 w-px bg-slate-800"></div>
      <div>
        <span class="text-slate-400 block text-[11px] font-medium">Sistem Durumu</span>
        @if (systemOnline()) {
          <span class="inline-flex items-center gap-1.5 text-emerald-400 font-bold">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Çevrimiçi
          </span>
        } @else {
          <span class="inline-flex items-center gap-1.5 text-rose-400 font-bold">
            <span class="w-2 h-2 rounded-full bg-rose-400"></span>
            Bağlantı Kesildi
          </span>
        }
      </div>
    </div>
  </div>
</section>
