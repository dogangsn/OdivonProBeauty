<header class="flex flex-wrap items-center justify-between gap-4 mb-6">
  <div>
    <div class="flex items-center gap-3">
      @if (icon()) {
        <span
          class="w-11 h-11 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center flex-shrink-0 shadow-xs border border-indigo-100 dark:border-indigo-900/50"
        >
          <span class="material-symbols-outlined icon-size-6">{{ icon() }}</span>
        </span>
      }
      <div>
        @if (eyebrow()) {
          <span
            class="block text-[11px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 mb-0.5"
          >
            {{ eyebrow() }}
          </span>
        }
        <h1
          class="m-0 text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight"
        >
          {{ title() }}
        </h1>
      </div>
    </div>
    @if (description()) {
      <p
        class="mt-1.5 mb-0 max-w-[65ch] text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400"
      >
        {{ description() }}
      </p>
    }
  </div>
  <div class="flex items-center gap-2.5">
    <ng-content select="[actions]" />
  </div>
</header>
