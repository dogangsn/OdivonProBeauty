<div class="backdrop" aria-hidden="true" (click)="requestClose()"></div>

<aside
  role="dialog"
  aria-modal="true"
  aria-labelledby="slide-over-title"
  aria-describedby="slide-over-description"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
  class="slide-over-panel"
>
  <div class="accent-line" aria-hidden="true"></div>
  <header class="slide-over-header">
    <div class="header-content">
      <div class="header-icon" aria-hidden="true">
        <span class="material-symbols-outlined icon-size-5">edit_note</span>
      </div>
      <div class="header-text">
        <span class="eyebrow-pill">{{ eyebrow() }}</span>
        <h2 id="slide-over-title">{{ title() }}</h2>
        <span id="slide-over-description">{{ description() }}</span>
      </div>
    </div>
    <button
      class="close-button odv-icon-btn"
      type="button"
      aria-label="Kapat"
      (click)="requestClose()"
    >
      <span class="material-symbols-outlined icon-size-5">close</span>
    </button>
  </header>

  <section class="drawer-body custom-scroll">
    <ng-content />
  </section>

  <footer class="slide-over-footer">
    <ng-content select="[drawer-footer]" />
  </footer>
</aside>
